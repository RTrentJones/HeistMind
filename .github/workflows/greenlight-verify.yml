name: greenlight-verify
# The run title names the Vercel environment + commit for humans. The beta/prod TARGET is resolved
# at runtime (job `resolve`) and shows as the gate job's name: `gate (beta)` / `gate (prod)`.
run-name: verify ${{ github.event.deployment.environment }} ${{ github.event.deployment.sha }}

# Vercel deploys heistmind on push and posts a deployment_status to GitHub; we verify the exact
# deployed URL with `greenlight verify` (verify/heistmind.config.ts). One call runs every mode in
# the spec — all must pass for the commit status to go green:
#   - api        : served + protection check (200 with bypass, else 401).
#   - playwright : the full e2e/ suite against the deployment (greenlight ≥ 2.15 injects the URL as
#                  PLAYWRIGHT_BASE_URL). Authenticated journeys via Supabase admin session injection
#                  (no Discord; see e2e/README.md).
#   - agent-web  : an LLM smoke, only when ANTHROPIC_API_KEY is set.
# Auth-gated specs skip themselves when this env's SUPABASE_SERVICE_ROLE_KEY secret is absent, so the
# gate still passes on the public surface until those secrets are wired.
#
# WHICH deployments (F101, fixed F103): only (a) the beta deployment — a non-Production deployment
# whose sha is `development`'s tip or an ancestor of it — and (b) a Production deployment whose sha
# is on `main`. Vercel posts the COMMIT SHA as `deployment.ref` (never the branch), so the branch
# facts are resolved from the GitHub API by scripts/verify-target.mjs (unit-tested in
# `pnpm test:scripts`) — F101's `deployment.ref == 'development'` filter skipped every gate.
# Feature-branch previews are NOT gated here (PR CI's `e2e` job runs the same suite against a local
# stack); they skip VISIBLY (a notice + job summary). A Production deployment of a sha not on main
# fails the run RED. A second Vercel deployment of an already-verified (target, sha) is skipped
# (dedupe on the earlier `gate (<target>)` check run). Before F101 every deployment_status ran the
# full gate, so one merge produced 2 concurrent runs sharing the same personas on the one Supabase
# project, and a sign-out in one invalidated the other's session (1d40c00: 1 of 2 runs failed).
on:
  deployment_status:

permissions:
  contents: read
  statuses: write
  checks: read # dedupe reads earlier `gate (<target>)` check runs; Production asserts supabase-ci's "Migrations applied (production)" check

env:
  # Exact pin, never `@latest`: the gate's behavior must not change under a commit. Lockstep with
  # the greenlight version the RTrentJones.dev wrapper + infra `?ref=` run (v0.10.0); bump
  # deliberately, together with supabase-ci.yml's GREENLIGHT_VERSION.
  GREENLIGHT_VERSION: '0.10.0'

jobs:
  # Which gate (if any) this deployment gets. Cheap and unserialized: it only reads branch facts.
  resolve:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve the gate target from the deployment (beta | prod | none)
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: node scripts/verify-target.mjs resolve

  verify:
    needs: resolve
    if: needs.resolve.outputs.target == 'beta' || needs.resolve.outputs.target == 'prod'
    # The dedupe below finds earlier passes by THIS name's check run on the sha — keep them in step.
    name: gate (${{ needs.resolve.outputs.target }})
    runs-on: ubuntu-latest
    # One gate at a time per target: the personas live in the project-global auth.users, so two
    # beta runs must never overlap (cancel-in-progress: false → queue, never kill a running gate).
    concurrency:
      group: greenlight-verify-${{ needs.resolve.outputs.target }}
      cancel-in-progress: false
    steps:
      # Inside the concurrency group, so an earlier gate for the same (target, sha) has finished.
      - uses: actions/checkout@v4
      - name: Skip if this commit is already verified on this target
        id: dedupe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.resolve.outputs.target }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: node scripts/verify-target.mjs dedupe

      - uses: actions/setup-node@v4
        if: steps.dedupe.outputs.skip != 'true'
        with:
          node-version: '24' # the greenlight CLI's floor — intentionally newer than the app's .nvmrc

      # Prod ordering backstop (F101). The Vercel production build already waits for this check
      # (vercel.json `ignoreCommand` → scripts/vercel-migration-gate.mjs); this re-asserts it so a
      # Production deployment whose `production` schema migrations did not apply turns this gate
      # RED (e.g. the Vercel gate was switched off). Same script; exit 1 = "migrations applied".
      - name: Production — assert "Migrations applied (production)" on this commit
        if: steps.dedupe.outputs.skip != 'true' && needs.resolve.outputs.target == 'prod'
        env:
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_SHA: ${{ github.event.deployment.sha }}
          VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
          VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
          GITHUB_CHECKS_TOKEN: ${{ github.token }}
          HEISTMIND_MIGRATION_GATE_TIMEOUT_S: '900'
          HEISTMIND_MIGRATION_GATE_INTERVAL_S: '20'
        run: |
          set +e
          node scripts/vercel-migration-gate.mjs
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error title=Prod schema not confirmed::supabase-ci's \"Migrations applied (production)\" check is not green for ${VERCEL_GIT_COMMIT_SHA}. The web code may be live ahead of its schema; re-run Supabase CI/CD for this commit."
            exit 1
          fi

      # The playwright mode shells out to `pnpm exec playwright test`, so deps + the browser must be
      # present before greenlight runs.
      - name: Setup pnpm
        if: steps.dedupe.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'
          run_install: false
      - name: Install dependencies
        if: steps.dedupe.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      # The e2e suite imports workspace packages (discord.spec.ts seeds the builtin ruleset from
      # @heist-mind/shared — the fixture-provenance rule), and workspace imports resolve to
      # dist/, which a bare install doesn't produce. `...` builds the package plus its deps.
      - name: Build workspace packages the e2e suite imports
        if: steps.dedupe.outputs.skip != 'true'
        run: pnpm exec turbo run build --filter="@heist-mind/shared..."
      - name: Install Playwright browser
        if: steps.dedupe.outputs.skip != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Greenlight verify (api + playwright + agent-web)
        if: steps.dedupe.outputs.skip != 'true'
        env:
          # Per-tool secret (the bypass value is per Vercel project) → no collision if another vercel
          # tool is added; the env var the spec reads stays generic.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET_HEISTMIND }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Forwarded to the playwright suite (greenlight injects PLAYWRIGHT_BASE_URL itself) to
          # exercise authenticated journeys. URL + anon are PUBLIC provider-instance config (the anon
          # key ships in the browser; its protection is RLS) → repo Variables, not secrets. Only the
          # service-role key (bypasses RLS) is a real secret. Auth specs skip if it's absent.
          E2E_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Authenticated journeys are a PRE-PROD gate: only inject the (RLS-bypassing) service-role
          # key on the beta gate. auth.users is project-global, so this keeps the prod
          # deployment_status from creating personas; Preview/beta still exercises the full auth flow,
          # and global-teardown deletes them afterwards. `== 'beta' && … || ''` avoids the
          # empty-string falsy trap of the usual `&& '' || …` ternary.
          SUPABASE_SERVICE_ROLE_KEY: ${{ needs.resolve.outputs.target == 'beta' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          # Artifact identity: the commit Vercel built. The spec asserts /__version serves exactly
          # this (through the protection bypass); --expect-sha arms the harness's own probe too.
          GREENLIGHT_EXPECTED_SHA: ${{ github.event.deployment.sha }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: npx -y "@rtrentjones/greenlight@${GREENLIGHT_VERSION}" verify --url "$TARGET_URL" --spec verify/heistmind.config.ts --expect-sha "$GREENLIGHT_EXPECTED_SHA"

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.dedupe.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.deployment_status.id }}
          path: e2e/.report/
          retention-days: 7
          if-no-files-found: ignore
