name: greenlight-verify

# Vercel deploys heistmind on push and posts a deployment_status to GitHub; we verify the exact
# deployed URL. ANTHROPIC_API_KEY (optional) enables the agent-web scenarios — absent → omitted
# (see verify/heistmind.config.ts), so the gate stays green on api + test alone.
on:
  deployment_status:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    if: ${{ github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deps (for test-mode)
        run: |
          corepack enable || true
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile;
          elif [ -f yarn.lock ]; then yarn install --frozen-lockfile;
          else npm ci; fi
      - name: Verify the deployment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx -y @rtrentjones/greenlight@latest verify --url "${{ github.event.deployment_status.target_url }}" --spec verify/heistmind.config.ts
