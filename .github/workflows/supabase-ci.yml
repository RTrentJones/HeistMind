name: Supabase CI/CD

on:
  push:
    branches: [main, development]
    paths:
      - 'supabase/**'
      - 'packages/database/**'
      - '.github/workflows/supabase-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'packages/database/**'

jobs:
  validate:
    name: Validate Database Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start

      - name: Validate migration syntax
        run: supabase db diff --schema public

      - name: Run database tests
        run: |
          # Apply all migrations to local instance
          supabase db reset

          # Verify schema is valid
          supabase db diff --schema public | tee diff-output.txt

          # Check if there are unexpected differences
          if [ -s diff-output.txt ]; then
            echo "❌ Schema differences detected!"
            cat diff-output.txt
            exit 1
          else
            echo "✅ Schema validation passed"
          fi

      - name: Generate and validate types
        run: |
          # Generate TypeScript types from local schema
          pnpm --filter @heist-mind/database db:types-local

          # Check if generated types compile
          pnpm --filter @heist-mind/database tsc --noEmit || {
            echo "❌ Generated types do not compile!"
            exit 1
          }

          echo "✅ Type generation successful"

      - name: Stop Supabase
        if: always()
        run: supabase stop

  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Debug environment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "=== Checking environment variables ==="

          # Check if secrets are set (without revealing them)
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && echo "✅ SUPABASE_ACCESS_TOKEN is set (${#SUPABASE_ACCESS_TOKEN} chars)" || echo "❌ SUPABASE_ACCESS_TOKEN is NOT set"
          [ -n "$SUPABASE_DB_PASSWORD" ] && echo "✅ SUPABASE_DB_PASSWORD is set (${#SUPABASE_DB_PASSWORD} chars)" || echo "❌ SUPABASE_DB_PASSWORD is NOT set"
          [ -n "$SUPABASE_PROJECT_ID" ] && echo "✅ SUPABASE_PROJECT_ID is set: $SUPABASE_PROJECT_ID" || echo "❌ SUPABASE_PROJECT_ID is NOT set"

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "🔗 Linking to Supabase project..."
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} || {
            echo "❌ Failed to link Supabase project"
            echo "Make sure SUPABASE_ACCESS_TOKEN is a valid personal access token from https://app.supabase.com/account/tokens"
            exit 1
          }
          echo "✅ Successfully linked to Supabase project: ${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Sync with remote database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "📥 Pulling remote migrations..."

          # Pull remote schema to ensure we're in sync
          supabase db pull --password "$SUPABASE_DB_PASSWORD" || {
            echo "⚠️ Could not pull remote migrations, continuing anyway..."
          }

          # List current migrations
          echo "📋 Current local migrations:"
          ls -la supabase/migrations/

          echo "✅ Ready to push new migrations"

      - name: Deploy database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🚀 Deploying migrations to Supabase..."

          # Set schema based on branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            export TARGET_SCHEMA="production"
            echo "📦 Deploying to PRODUCTION schema"
          else
            export TARGET_SCHEMA="development"
            echo "📦 Deploying to DEVELOPMENT schema"
          fi

          # Create a temporary migration to set the target schema
          TEMP_MIGRATION="supabase/migrations/$(date +%s)_set_target_schema.sql"
          cat > "$TEMP_MIGRATION" << EOF
          -- Set target schema for this deployment
          DO \$\$
          BEGIN
              -- Set the target schema for subsequent operations
              EXECUTE format('SET heistmind.target_schema = %L', '$TARGET_SCHEMA');
              RAISE NOTICE 'Target schema set to: %', '$TARGET_SCHEMA';
          END \$\$;
          EOF

          echo "📝 Created temporary schema targeting migration"

          # Push migrations to remote database with password
          echo "🔄 Pushing migrations..."
          supabase db push --password "$SUPABASE_DB_PASSWORD" || {
            echo "❌ Failed to push migrations"
            rm -f "$TEMP_MIGRATION"
            exit 1
          }

          # Clean up temporary migration
          rm -f "$TEMP_MIGRATION"
          echo "✅ Migrations deployed successfully to $TARGET_SCHEMA schema"

      - name: Verify deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "🔍 Verifying deployment..."

          # List projects to verify connection
          supabase projects list | grep -q "${{ secrets.SUPABASE_PROJECT_ID }}" || {
            echo "❌ Cannot verify connection to Supabase project!"
            exit 1
          }

          echo "✅ Deployment verification passed"

      - name: Generate production types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "📝 Generating TypeScript types from production schema..."

          # Generate types from remote database
          pnpm --filter @heist-mind/database db:types || {
            echo "⚠️ Failed to generate types, but deployment was successful"
            # Don't fail the job if type generation fails
          }

          echo "✅ Type generation completed"

      - name: Commit updated types
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update database types after migration [skip ci]'
          file_pattern: 'packages/database/types.ts'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          skip_dirty_check: false
          skip_fetch: false
        if: github.ref == 'refs/heads/main'

      - name: Deployment summary
        if: success()
        run: |
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project ID**: ${{ secrets.SUPABASE_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Successfully deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Database migrations have been applied to the **${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}** schema." >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: failure()
    steps:
      - name: Failure summary
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The database deployment has failed. Please check the logs and resolve any issues before retrying." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Common issues to check:" >> $GITHUB_STEP_SUMMARY
          echo "1. **Invalid access token**: Ensure SUPABASE_ACCESS_TOKEN is from https://app.supabase.com/account/tokens" >> $GITHUB_STEP_SUMMARY
          echo "2. **Wrong project ID**: Verify SUPABASE_PROJECT_ID matches your project reference ID" >> $GITHUB_STEP_SUMMARY
          echo "3. **Database password**: Ensure SUPABASE_DB_PASSWORD is the database password, not the API key" >> $GITHUB_STEP_SUMMARY
          echo "4. **Migration errors**: Check if migrations have SQL syntax errors" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the error logs above" >> $GITHUB_STEP_SUMMARY
          echo "2. Fix any migration issues locally" >> $GITHUB_STEP_SUMMARY
          echo "3. Test with \`supabase db diff\` before pushing" >> $GITHUB_STEP_SUMMARY
          echo "4. Push the fix to trigger a new deployment" >> $GITHUB_STEP_SUMMARY