name: CI

on:
  push:
    branches: [main, development]
    paths-ignore: ['*.md', 'docs/**', '.gitignore', '.clinerule/**', '.memory-bank/**']
  pull_request:
    branches: [main, development]
    paths-ignore: ['*.md', 'docs/**', '.gitignore', '.clinerule/**', '.memory-bank/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Validate database types
        run: pnpm --filter database validate-types

      - name: Run tests
        run: pnpm test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.sha }}
          path: |
            apps/web/coverage/
            packages/ui/coverage/
            packages/shared/coverage/
            packages/database/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ github.sha }}
          path: |
            apps/*/dist
            apps/*/.next
            packages/*/dist
          retention-days: 7
          if-no-files-found: ignore
