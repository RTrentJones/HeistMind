name: CI

on:
  push:
    branches: [main, development]
    paths-ignore: ['*.md', 'docs/**', '.gitignore', '.clinerule/**', '.memory-bank/**']
  pull_request:
    branches: [main, development]
    paths-ignore: ['*.md', 'docs/**', '.gitignore', '.clinerule/**', '.memory-bank/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.0' # keep in lockstep with .nvmrc
  PNPM_VERSION: '9.15.0'

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      # ADVISORY dead-code scan (audit D6 — knip would have flagged the F68-era dead auth
      # surface). Stays continue-on-error until the first-run noise (see the job log) is
      # triaged; promote to blocking after.
      - name: Dead-code scan (knip, advisory)
        continue-on-error: true
        run: pnpm exec knip

      # Type integrity is covered twice already: the compile-time checks in
      # packages/database/src/type-integrity.test.ts run under `pnpm type-check` (tsc) and the
      # test sweep below — a dedicated step would just be a third copy that can drift (its
      # predecessor pointed at a deleted file and only CI noticed).
      - name: Run tests
        run: pnpm test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.sha }}
          path: |
            apps/web/coverage/
            packages/ui/coverage/
            packages/shared/coverage/
            packages/database/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ github.sha }}
          path: |
            apps/*/dist
            apps/*/.next
            packages/*/dist
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright + local Supabase)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots Postgres + Auth via Docker and applies supabase/migrations (incl. the profiles
      # trigger), so admin-created users get a real profile row — the same state a Discord
      # sign-up produces. Maps the local stack's keys into the env the app + suite read.
      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env
        # `supabase status -o env` emits KEY="value" (quoted); appended verbatim to $GITHUB_ENV the
        # quotes become part of the value → the supabase-js client gets `"http://…"` and throws
        # "Invalid URL". Strip the surrounding quotes so the URL/keys are clean.
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm dev:web` (next dev) imports the workspace packages' BUILD output — e.g.
      # `@heist-mind/ui/styles` → dist/index.css (CSS can't be transpiled on the fly). Vercel builds
      # them in prod; build them here so the local dev server boots.
      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      # PLAYWRIGHT_BASE_URL is unset → playwright.config boots `pnpm dev:web` against the local
      # stack. global-setup mints + injects the GM/Player sessions using the service-role key.
      - name: Run Playwright suite
        run: pnpm exec playwright test

      - name: Stop local Supabase
        if: always()
        run: supabase stop || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: e2e/.report/
          retention-days: 7
          if-no-files-found: ignore
