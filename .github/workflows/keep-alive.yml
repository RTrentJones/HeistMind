name: Keep Alive

# Supabase free-tier projects are PAUSED after 7 days of inactivity, which then
# breaks the API, deploys, and the live app. This job touches the database (and,
# optionally, the deployed site) on a cron so the project never goes idle.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_PROJECT_ID   already used by supabase-ci.yml (the project ref)
#   SUPABASE_ANON_KEY     the project's anon/public key
# Optional:
#   SITE_URL              deployed URL to keep warm, e.g. https://heistmind.app
#
# NOTE: GitHub only runs scheduled workflows from the repository's DEFAULT
# branch (currently `main`). This file must reach `main` before the cron fires.

on:
  schedule:
    # Mon & Thu at 09:00 UTC — every ~3-4 days, well inside the 7-day window.
    - cron: '0 9 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "$PROJECT_ID" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_PROJECT_ID and SUPABASE_ANON_KEY secrets are required."
            exit 1
          fi
          # The REST root returns the OpenAPI description for any valid key —
          # table/schema-agnostic, so it survives schema changes.
          url="https://${PROJECT_ID}.supabase.co/rest/v1/"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}")
          echo "Supabase responded with HTTP $code"
          if [ "$code" -ge 400 ]; then
            echo "::error::Supabase ping failed (HTTP $code)."
            exit 1
          fi

      - name: Ping deployed site
        if: ${{ env.SITE_URL != '' }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -L "$SITE_URL")
          echo "Site responded with HTTP $code"
          if [ "$code" -ge 400 ]; then
            echo "::error::Site ping failed (HTTP $code)."
            exit 1
          fi
